name: CI

on:
  push:
    tags: ["*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: JavaScript syntax
        run: node --check src/research_graph/web/app.js

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (coverage >= 90%)
        run: uv run pytest --cov-fail-under=90

      - name: CLI smoke test
        run: |
          uv run rg --help
          uv run rg version
          uv run rg check-config

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cars
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cars -d cars_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://cars:test-only-password@localhost:5432/cars_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/test_postgres.py --no-cov -q

  browser:
    name: Docker and browser smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Prepare a synthetic smoke-test model
        run: |
          uv run rg migrate
          uv run rg seed
          uv run rg prepare-data data/demo.csv --size 150
          uv run rg train --threads 1 --iterations 5
      - name: Start Docker application
        run: docker compose up --build -d --wait
      - name: Browser user journey and mobile layout
        run: uv run python scripts/check_web.py http://127.0.0.1:8000
      - name: Container logs
        if: always()
        run: docker compose logs > artifacts/compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-smoke
          path: |
            artifacts/ui-*.png
            artifacts/compose.log
      - name: Stop containers
        if: always()
        run: docker compose down
