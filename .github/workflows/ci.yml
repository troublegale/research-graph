name: CI

on:
  push:
    tags: ["*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (coverage >= 90%)
        run: uv run pytest --cov-fail-under=90

      - name: CLI smoke test
        run: |
          uv run rg --help
          uv run rg version
          uv run rg check-config

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cars
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cars -d cars_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://cars:test-only-password@localhost:5432/cars_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/test_postgres.py --no-cov -q
